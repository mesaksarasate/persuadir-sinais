name: Persuadir Sinais

# Acionado de fora (pelo cron-job.org) via evento repository_dispatch,
# e não pelo agendador `schedule:` do GitHub - de propósito, para não
# herdar o intervalo mínimo de ~5min nem o desligamento automático
# após 60 dias de inatividade (essas regras valem para `schedule:`,
# não para repository_dispatch).
#
# `workflow_dispatch` também fica disponível para rodar manualmente
# pelo próprio site do GitHub, útil para testar sem esperar o cron.
on:
  repository_dispatch:
    types: [executar-ciclo]
  workflow_dispatch: {}

jobs:
  rodar-sinais:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o ciclo do Persuadir Sinais
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main.py
